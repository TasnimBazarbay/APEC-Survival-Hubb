<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | APEC Survival Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="container">
        <h2>APEC Survival Hub</h2>
        <p style="text-align: center; margin-bottom: 30px;">Единая система управления ресурсами кампуса</p>

        <div id="login-ui">
            <button onclick="signInWithGoogle()" class="google-btn" style="display: flex; align-items: center; justify-content: center; gap: 12px;">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="24" alt="Google">
                Войти через @apec.edu.kz
            </button>
        </div>

        <div id="admin-section" class="hidden fade-in" style="margin-top: 30px; border-top: 1px solid rgba(30, 58, 138, 0.1); padding-top: 30px;">
            <p style="text-align: center; font-weight: 600; color: var(--primary); margin-bottom: 15px;">Подтверждение полномочий</p>
            <input type="password" id="admin_code" placeholder="Введите код администратора">
            <button onclick="verifyAdmin()">АВТОРИЗОВАТЬСЯ</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6joyWuIT9M44dbX_i1jbmM-nFMGUwK4w",
            authDomain: "apecsurvivalhub.firebaseapp.com",
            projectId: "apecsurvivalhub",
            storageBucket: "apecsurvivalhub.firebasestorage.app",
            messagingSenderId: "528195180456",
            appId: "1:528195180456:web:c73ea9aa6e22a0251eaf9d",
            measurementId: "G-FVX9MMC406"
        };

        firebase.initializeApp(firebaseConfig);
        let userData = null;

        async function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ hd: 'apec.edu.kz' });

            try {
                const result = await firebase.auth().signInWithPopup(provider);
                userData = {
                    email: result.user.email,
                    name: result.user.displayName
                };

                // Проверка прав администратора (ВРЕМЕННО ОТКЛЮЧЕНА ДЛЯ ТЕСТА)
                if (userData.email === 'ibazarbai25@apec.edu.kz' || userData.email === 'idzhanai25@apec.edu.kz') {
                    document.getElementById('login-ui').classList.add('hidden');
                    document.getElementById('admin-section').classList.remove('hidden');
                } else {
                    sendAuthToServer('student');
                }
            } catch (error) {
                showToast("Ошибка авторизации: " + error.message);
            }
        }

        function verifyAdmin() {
            const code = document.getElementById('admin_code').value;
            if (code === 'admin2026') {
                sendAuthToServer('admin');
            } else {
                showToast("Неверный код доступа!");
            }
        }

        async function sendAuthToServer(role) {
            const response = await fetch('/auth_firebase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: userData.email,
                    name: userData.name,
                    role: role
                })
            });

            if (response.ok) {
                window.location.href = (role === 'admin') ? "/admin" : "/";
            } else {
                const data = await response.json();
                showToast(data.message || "Ошибка сервера");
            }
        }

        // Вспомогательная функция для UI уведомлений вместо alert()
        function showToast(message) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }
    </script>
</body>
</html>
